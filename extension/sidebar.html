<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid #1e293b; }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; color: #94a3b8; border-bottom: 2px solid transparent; }
    .tab.active { color: #6366f1; border-bottom-color: #6366f1; }

    /* Panels */
    .panel { flex: 1; overflow-y: auto; padding: 12px; display: none; }
    .panel.active { display: block; }

    /* Graph container */
    #graphCanvas { width: 100%; height: 100%; min-height: 300px; }

    /* Notes list */
    .note-card { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    .note-card .title { font-size: 13px; font-weight: 600; color: #f1f5f9; }
    .note-card .summary { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .note-card .time { font-size: 11px; color: #475569; margin-top: 6px; }

    /* Chat */
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-input-bar { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #1e293b; }
    .chat-input-bar input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 13px; outline: none; }
    .chat-input-bar button { padding: 8px 16px; border-radius: 8px; border: none; background: #6366f1; color: white; cursor: pointer; font-size: 13px; }
    .msg { margin: 8px 0; padding: 10px; border-radius: 8px; font-size: 13px; max-width: 85%; }
    .msg.user { background: #6366f1; color: white; margin-left: auto; }
    .msg.ai { background: #1e293b; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-panel="notes">笔记</div>
    <div class="tab" data-panel="graph">图谱</div>
    <div class="tab" data-panel="chat">问答</div>
  </div>

  <!-- Notes Panel -->
  <div class="panel active" id="notes">
    <div id="notesList"></div>
  </div>

  <!-- Graph Panel -->
  <div class="panel" id="graph">
    <svg id="graphCanvas"></svg>
  </div>

  <!-- Chat Panel -->
  <div class="panel" id="chat">
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="msg ai">你好！问我任何关于你笔记的问题。</div>
      </div>
      <div class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="输入问题..." />
        <button id="chatSend">发送</button>
      </div>
    </div>
  </div>

  <script src="src/sidebar/sidebar.js"></script>
</body>
</html>
